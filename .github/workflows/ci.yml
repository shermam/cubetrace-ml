name: CI

on:
  push:
  pull_request:

jobs:
  lock:
    # Temporary (M1): the features and cu128 extras take torch and torchvision from download.pytorch.org,
    # which the agent's container cannot reach, so a runner resolves uv.lock and commits it to the branch.
    # The next commit removes this job and restores the checks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/task/M1-features'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
      - run: uv lock
      - run: uv sync --locked --extra features --dev
      - run: uv run --no-sync python -c "import torch, torchvision, timm; print(torch.__version__, torchvision.__version__, timm.__version__, torch.cuda.is_available())"
      - run: grep -A1 -E '^name = "(torch|torchvision|timm)"' uv.lock
      - name: commit the lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -F - <<'MSG'
          uv.lock with the features and cu128 extras, resolved on a GitHub runner.

          download.pytorch.org, where the extras' torch and torchvision come from, is not reachable from the
          agent's container; this commit is the temporary lock job's (CI), which the next commit removes.

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01BvXBPaFB4UMN9hyUmGugdw
          MSG
          git push
