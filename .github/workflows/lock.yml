name: lock (temporary)

on:
  push:
    branches: [task/M2-first-models]
    paths: [pyproject.toml, .github/workflows/lock.yml]

jobs:
  lock:
    # Temporary (M2): uv.lock's PyTorch packages come from download.pytorch.org, which the agent's
    # container cannot reach, so a runner resolves the lock after pyproject.toml gained matplotlib and
    # commits it to the branch. The next commit removes this workflow.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
      - run: uv lock
      - run: git diff --stat uv.lock
      - run: uv sync --locked --extra features --extra gcs
      - run: uv run --no-sync python -c "import torch, matplotlib; print(torch.__version__, matplotlib.__version__)"
      - name: commit the lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -F - <<'MSG'
          uv.lock with matplotlib, resolved on a GitHub runner.

          download.pytorch.org, where the extras' torch and torchvision come from, is not reachable from the
          agent's container; this commit is the temporary lock job's (CI), which the next commit removes.

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01BvXBPaFB4UMN9hyUmGugdw
          MSG
          git push
