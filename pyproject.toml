[project]
name = "cubetrace-ml"
version = "0.1.0"
description = "From cubetrace's recordings (video and the cube's move stream on one clock) to a dataset, features and models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "av>=14",
    "jsonschema>=4.23",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pillow>=10.1",
    "polars>=1.30",
]

[project.optional-dependencies]
# Bucket roots (gs://…), read with Application Default Credentials: only the coordinator needs them.
gcs = ["google-cloud-storage>=2.18"]
# The frozen encoders of `cubetrace-ml features` (M1). `features` takes PyTorch's CPU build on Linux and
# Windows (the explicit pytorch-cpu index below; PyPI's Linux wheels are the CUDA build, 2.5 GB more), and
# a GPU machine takes `cu128` (the CUDA 12.8 build) instead: the two are exclusive.
features = ["torch>=2.7", "torchvision>=0.22", "timm>=1.0"]
cu128 = ["torch>=2.7", "torchvision>=0.22", "timm>=1.0"]

[project.scripts]
cubetrace-ml = "cubetrace_ml.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

# uv's PyTorch pattern: torch and torchvision from PyTorch's own indexes, chosen by the extra.
[tool.uv]
conflicts = [[{ extra = "features" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "features", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "features", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cubetrace_ml"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "cubetrace_ml/schemas"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]
# The docs write the minus, the times sign and the en dash as such.
allowed-confusables = ["−", "×", "–"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
