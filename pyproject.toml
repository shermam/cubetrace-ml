[project]
name = "cubetrace-ml"
version = "0.1.0"
description = "From cubetrace's recordings (video and the cube's move stream on one clock) to a dataset, features and models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "av>=14",
    "jsonschema>=4.23",
    "numpy>=2.0",
    "pillow>=10.1",
    "polars>=1.30",
]

[project.optional-dependencies]
# Bucket roots (gs://…), read with Application Default Credentials: only the coordinator needs them.
gcs = ["google-cloud-storage>=2.18"]

[project.scripts]
cubetrace-ml = "cubetrace_ml.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cubetrace_ml"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "cubetrace_ml/schemas"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]
# The docs write the minus, the times sign and the en dash as such.
allowed-confusables = ["−", "×", "–"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
